<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="920" height="372" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#1f2933">class 里两个都叫 static，管的是两件不同的事</text>

  <!-- ============ ① static 成员 ============ -->
  <rect x="15" y="40" width="435" height="290" rx="10" fill="#fbfbfc" stroke="#d3d9e0" stroke-width="1.5"/>
  <text x="30" y="66" font-size="16" font-weight="700" fill="#1f2933">① static 成员：变量属于谁</text>
  <text x="30" y="90" font-size="13.5" fill="#1f2933" font-family="Menlo, Consolas, monospace">static int count;    int data;</text>

  <rect x="35" y="106" width="395" height="64" rx="8" fill="#f3f5f7" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="50" y="143" font-size="14" font-weight="700" fill="#1f2933">Packet 类</text>
  <rect x="140" y="118" width="275" height="40" rx="6" fill="#fcd9d5" stroke="#b42318" stroke-width="2"/>
  <text x="277" y="143" font-size="13" text-anchor="middle" fill="#1f2933">count（static）：整个 class 只有一份</text>

  <rect x="45" y="218" width="175" height="58" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="132" y="241" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">object 1</text>
  <text x="132" y="261" font-size="12.5" text-anchor="middle" fill="#1f2933">data = 10（自己的一份）</text>
  <rect x="245" y="218" width="175" height="58" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="332" y="241" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">object 2</text>
  <text x="332" y="261" font-size="12.5" text-anchor="middle" fill="#1f2933">data = 20（自己的一份）</text>

  <g stroke="#b42318" stroke-width="1.5" fill="none" stroke-dasharray="5 3">
    <path d="M132,218 L230,159"/>
    <path d="M332,218 L320,159"/>
  </g>
  <text x="232" y="200" font-size="12.5" text-anchor="middle" fill="#b42318">共用同一个 count</text>
  <text x="30" y="310" font-size="13" font-weight="700" fill="#1f2933">普通成员每个 object 一份；static 成员所有 object 共用</text>

  <!-- ============ ② 生命周期 ============ -->
  <rect x="470" y="40" width="435" height="290" rx="10" fill="#fbfbfc" stroke="#d3d9e0" stroke-width="1.5"/>
  <text x="485" y="66" font-size="16" font-weight="700" fill="#1f2933">② 生命周期：方法里的局部变量活多久</text>
  <text x="485" y="90" font-size="13.5" fill="#1f2933" font-family="Menlo, Consolas, monospace">function void f();  int tmp;  ...</text>

  <!-- automatic -->
  <text x="485" y="122" font-size="13.5" font-weight="700" fill="#1a7f45">automatic（class 方法默认）</text>
  <rect x="485" y="134" width="88" height="30" rx="5" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="529" y="154" font-size="12.5" text-anchor="middle" fill="#1f2933">第 1 次调用</text>
  <rect x="485" y="178" width="88" height="30" rx="5" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="529" y="198" font-size="12.5" text-anchor="middle" fill="#1f2933">第 2 次调用</text>
  <rect x="600" y="134" width="70" height="30" rx="5" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="635" y="154" font-size="13" text-anchor="middle" fill="#1f2933" font-family="Menlo, Consolas, monospace">tmp</text>
  <rect x="600" y="178" width="70" height="30" rx="5" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="635" y="198" font-size="13" text-anchor="middle" fill="#1f2933" font-family="Menlo, Consolas, monospace">tmp</text>
  <g stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a2)">
    <path d="M573,149 L599,149"/>
    <path d="M573,193 L599,193"/>
  </g>
  <text x="485" y="234" font-size="12.5" fill="#1f2933">每次调用一份新的 tmp，</text>
  <text x="485" y="253" font-size="12.5" fill="#1f2933">调用结束就释放</text>

  <!-- static lifetime -->
  <text x="700" y="122" font-size="13.5" font-weight="700" fill="#b42318">static 生命周期</text>
  <rect x="700" y="134" width="88" height="30" rx="5" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="744" y="154" font-size="12.5" text-anchor="middle" fill="#1f2933">第 1 次调用</text>
  <rect x="700" y="178" width="88" height="30" rx="5" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="744" y="198" font-size="12.5" text-anchor="middle" fill="#1f2933">第 2 次调用</text>
  <rect x="820" y="154" width="70" height="34" rx="5" fill="#fcd9d5" stroke="#b42318" stroke-width="2"/>
  <text x="855" y="176" font-size="13" text-anchor="middle" fill="#1f2933" font-family="Menlo, Consolas, monospace">tmp</text>
  <g stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a2)">
    <path d="M788,149 L819,164"/>
    <path d="M788,193 L819,178"/>
  </g>
  <text x="700" y="234" font-size="12.5" fill="#1f2933">所有调用共用一个 tmp，</text>
  <text x="700" y="253" font-size="12.5" fill="#1f2933">一直存在，保留上次的值</text>

  <line x1="688" y1="108" x2="688" y2="262" stroke="#d3d9e0" stroke-width="1.5"/>
  <text x="485" y="310" font-size="13" font-weight="700" fill="#1f2933">automatic 是"static 生命周期"的反义词，不是 static 成员的反义词</text>

  <text x="20" y="356" font-size="13.5" fill="#1f2933">① 回答"这个成员属于 class 还是属于某个 object"；② 回答"方法每次被调用时，局部变量是不是新的一份"。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>

  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2933">同一个时间步（t=10）里，三个打印任务分别在什么时候打印？</text>

  <!-- ============ 三个阶段 ============ -->
  <g stroke-width="1.5">
    <rect x="20"  y="46" width="280" height="124" rx="10" fill="#fff8ec" stroke="#e3b56b"/>
    <rect x="320" y="46" width="280" height="124" rx="10" fill="#f3f5f7" stroke="#b8c1cc"/>
    <rect x="620" y="46" width="280" height="124" rx="10" fill="#eef5fd" stroke="#8db8e4"/>
  </g>
  <g fill="#9aa5b1">
    <path d="M304 108 L316 108 L316 103 L326 110 L316 117 L316 112 L304 112 Z" transform="translate(-4 -1)"/>
    <path d="M604 108 L616 108 L616 103 L626 110 L616 117 L616 112 L604 112 Z" transform="translate(-4 -1)"/>
  </g>

  <g font-size="15" font-weight="700" fill="#1f2933">
    <text x="36" y="74">① 依次执行语句</text>
    <text x="336" y="74">② 更新非阻塞赋值</text>
    <text x="636" y="74">③ 时间步末尾（时间即将推进）</text>
  </g>
  <g font-size="13" fill="#3e4c59">
    <text x="36" y="102">a &lt;= 1 只是"排队"，此刻 a 还是 0</text>
    <text x="36" y="124">$display 执行到这一句，立刻打印</text>
    <text x="336" y="102">排队的赋值生效：</text>
    <text x="336" y="124" font-weight="700" fill="#1f2933">a 从 0 变成 1</text>
    <text x="636" y="102">$strobe 在这里打印一次</text>
    <text x="636" y="124">$monitor 检查参数有没有变化，</text>
    <text x="636" y="144">变了就在这里打印</text>
  </g>

  <!-- 打印结果 chips -->
  <g font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <rect x="60" y="184" width="200" height="28" rx="6" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
    <text x="160" y="203" fill="#8a4f08" text-anchor="middle">display : a=0</text>
    <rect x="626" y="184" width="130" height="28" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="691" y="203" fill="#1f4f8a" text-anchor="middle">strobe : a=1</text>
    <rect x="766" y="184" width="130" height="28" rx="6" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
    <text x="831" y="203" fill="#14653a" text-anchor="middle">monitor: a=1</text>
  </g>

  <!-- 时间轴 -->
  <line x1="20" y1="240" x2="890" y2="240" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M890 234 L900 240 L890 246" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="460" y="232" font-size="12.5" fill="#52606d" text-anchor="middle">① ② ③ 都发生在仿真时间 t=10 这一刻，仿真时间还没有前进</text>

  <!-- ============ 代码 ============ -->
  <rect x="20" y="266" width="470" height="156" rx="8" fill="#f7f8fa" stroke="#d3d9e0" stroke-width="1.5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#1f2933">
    <text x="36" y="292">a = 0;</text>
    <text x="36" y="314">$monitor("monitor : a=%0d", a);</text>
    <text x="36" y="336">#10;</text>
    <text x="36" y="358">a &lt;= 1;     <tspan fill="#7b8794">// 非阻塞：排队，本步稍后才更新</tspan></text>
    <text x="36" y="380">$display("display : a=%0d", a);  <tspan fill="#b8690f" font-weight="700">// 0</tspan></text>
    <text x="36" y="402">$strobe ("strobe  : a=%0d", a);  <tspan fill="#2b6cb0" font-weight="700">// 1</tspan></text>
  </g>

  <!-- ============ 对比 ============ -->
  <text x="510" y="288" font-size="15" font-weight="700" fill="#1f2933">三者对比</text>

  <rect x="510" y="300" width="84" height="24" rx="5" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="552" y="317" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8a4f08" text-anchor="middle">$display</text>
  <text x="606" y="316" font-size="13" fill="#1f2933">执行到就打印，看到的是<tspan font-weight="700">此刻</tspan>的值</text>

  <rect x="510" y="338" width="84" height="24" rx="5" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="552" y="355" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1f4f8a" text-anchor="middle">$strobe</text>
  <text x="606" y="354" font-size="13" fill="#1f2933">时间步末尾打印，看到的是<tspan font-weight="700">最终稳定</tspan>的值</text>

  <rect x="510" y="376" width="84" height="24" rx="5" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="552" y="393" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14653a" text-anchor="middle">$monitor</text>
  <text x="606" y="392" font-size="13" fill="#1f2933">参数<tspan font-weight="700">一变</tspan>就在时间步末尾打印</text>
  <text x="606" y="412" font-size="12" fill="#52606d">只有一个生效，再次调用会覆盖前一个</text>
</svg>

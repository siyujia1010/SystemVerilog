<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
  </defs>
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#1f2933">task change(Packet p) 里执行 p = new()，外面的 p1 会不会跟着改指向？（先有 p1 = new()，指向 Object A）</text>

  <!-- column headers -->
  <g font-size="13.5" font-weight="700" fill="#52606d" text-anchor="middle">
    <text x="165" y="56">① 调用前</text><text x="460" y="56">② 进入 task</text><text x="755" y="56">③ 执行 p = new()</text>
  </g>

  <!-- ================= ROW 1: 不加 ref ================= -->
  <rect x="15" y="66" width="890" height="190" rx="10" fill="#fbfbfc" stroke="#d3d9e0" stroke-width="1.5"/>
  <rect x="15" y="66" width="130" height="190" rx="10" fill="#fff5f5" stroke="#f0b4b4" stroke-width="1.5"/>
  <text x="80" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#b42318">不加 ref</text>
  <text x="80" y="114" font-size="12" text-anchor="middle" fill="#1f2933" font-family="Menlo, Consolas, monospace">Packet p</text>
  <text x="80" y="140" font-size="12" text-anchor="middle" fill="#52606d">形参 p 是 p1 的</text>
  <text x="80" y="158" font-size="12" text-anchor="middle" fill="#52606d">一份"箭头副本"</text>

  <!-- stage 1 -->
  <rect x="180" y="128" width="66" height="34" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="213" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1</text>
  <rect x="290" y="120" width="96" height="50" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="338" y="150" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object A</text>
  <path d="M246,145 L289,145" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- stage 2 -->
  <rect x="470" y="98" width="66" height="34" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="503" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1</text>
  <rect x="470" y="160" width="66" height="34" rx="6" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="503" y="182" font-size="14" font-weight="700" text-anchor="middle" fill="#14653a" font-family="Menlo, Consolas, monospace">p</text>
  <rect x="590" y="120" width="96" height="50" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="638" y="150" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object A</text>
  <g stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M536,115 L589,135"/><path d="M536,177 L589,156"/>
  </g>
  <text x="560" y="214" font-size="12" text-anchor="middle" fill="#52606d">两个独立的 handle，指向同一个对象</text>

  <!-- stage 3 -->
  <rect x="740" y="86" width="66" height="34" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="773" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1</text>
  <rect x="740" y="176" width="66" height="34" rx="6" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="773" y="198" font-size="14" font-weight="700" text-anchor="middle" fill="#14653a" font-family="Menlo, Consolas, monospace">p</text>
  <rect x="830" y="86" width="68" height="34" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="864" y="108" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object A</text>
  <rect x="830" y="176" width="68" height="34" rx="8" fill="#d8f3e3" stroke="#1a7f45" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="864" y="198" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object B</text>
  <g stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M806,103 L829,103"/><path d="M806,193 L829,193"/>
  </g>
  <text x="755" y="232" font-size="13" font-weight="700" text-anchor="middle" fill="#b42318">p1 仍然指向 A，没变 ✗</text>
  <text x="755" y="248" font-size="11.5" text-anchor="middle" fill="#52606d">task 结束，p 消失</text>

  <!-- ================= ROW 2: 加 ref ================= -->
  <rect x="15" y="268" width="890" height="190" rx="10" fill="#fbfbfc" stroke="#d3d9e0" stroke-width="1.5"/>
  <rect x="15" y="268" width="130" height="190" rx="10" fill="#f0faf4" stroke="#a6dcbb" stroke-width="1.5"/>
  <text x="80" y="294" font-size="15" font-weight="700" text-anchor="middle" fill="#1a7f45">加 ref</text>
  <text x="80" y="316" font-size="12" text-anchor="middle" fill="#1f2933" font-family="Menlo, Consolas, monospace">ref Packet p</text>
  <text x="80" y="342" font-size="12" text-anchor="middle" fill="#52606d">形参 p 就是 p1</text>
  <text x="80" y="360" font-size="12" text-anchor="middle" fill="#52606d">的"别名"</text>

  <!-- stage 1 -->
  <rect x="180" y="330" width="66" height="34" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="213" y="352" font-size="14" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1</text>
  <rect x="290" y="322" width="96" height="50" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="338" y="352" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object A</text>
  <path d="M246,347 L289,347" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- stage 2: one box, two names -->
  <rect x="470" y="326" width="66" height="42" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="503" y="352" font-size="13" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1 = p</text>
  <rect x="470" y="378" width="66" height="22" rx="11" fill="#d8f3e3" stroke="#1a7f45" stroke-width="1.5"/>
  <text x="503" y="394" font-size="12" text-anchor="middle" fill="#14653a">task 里叫 p</text>
  <path d="M503,378 L503,369" stroke="#1a7f45" stroke-width="1.5" fill="none"/>
  <rect x="590" y="322" width="96" height="50" rx="8" fill="#fde8c4" stroke="#b8690f" stroke-width="1.5"/>
  <text x="638" y="352" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object A</text>
  <path d="M536,347 L589,347" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="560" y="424" font-size="12" text-anchor="middle" fill="#52606d">只有一个 handle 变量，两个名字</text>

  <!-- stage 3 -->
  <rect x="715" y="326" width="66" height="42" rx="6" fill="#dbe9fb" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="748" y="352" font-size="13" font-weight="700" text-anchor="middle" fill="#1f4f8a" font-family="Menlo, Consolas, monospace">p1 = p</text>
  <rect x="830" y="296" width="68" height="34" rx="8" fill="#f0f1f3" stroke="#c4c9cf" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="864" y="318" font-size="12.5" text-anchor="middle" fill="#8a929b">Object A</text>
  <rect x="830" y="350" width="68" height="34" rx="8" fill="#d8f3e3" stroke="#1a7f45" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="864" y="372" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933">Object B</text>
  <path d="M781,347 L829,366" stroke="#b42318" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <path d="M781,342 L829,316" stroke="#c4c9cf" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="755" y="424" font-size="13" font-weight="700" text-anchor="middle" fill="#1a7f45">p1 改指向 B 了 ✓</text>
  <text x="755" y="440" font-size="11.5" text-anchor="middle" fill="#52606d">改 p 就是改 p1</text>

  <!-- footer -->
  <rect x="15" y="468" width="890" height="26" rx="6" fill="#fff8ec" stroke="#e3b56b" stroke-width="1.5"/>
  <text x="460" y="486" font-size="13" text-anchor="middle" fill="#1f2933">p.data = 100（改对象）：两种写法外面都能看到；ref 额外的能力是让 task 能改外面的 handle 本身</text>
</svg>
